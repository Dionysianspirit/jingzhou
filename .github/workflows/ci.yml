name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # The tests never load the embedding model (retrieval is exercised with
      # fake vectors), so sentence-transformers and its multi-GB torch
      # dependency are deliberately left out. httpx is what TestClient needs.
      - name: Install test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install "fastapi>=0.115.0" "uvicorn[standard]>=0.30.0" "openai>=1.50.0" "numpy>=1.26.0" "python-dotenv>=1.0.0" "httpx>=0.27"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Frontend syntax check
        run: node --check static/studio.js

  # Compatibility signal, not a gate: imports the exported files with Anki's
  # own importer. It can break when the `anki` package changes its API, which
  # is worth knowing about but should not block unrelated changes.
  anki-import:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies and Anki
        run: |
          python -m pip install -U pip
          python -m pip install "fastapi>=0.115.0" "uvicorn[standard]>=0.30.0" "openai>=1.50.0" "numpy>=1.26.0" "python-dotenv>=1.0.0" "httpx>=0.27" anki
      - name: Import exported flashcards into a real Anki collection
        run: python -m unittest tests.test_anki -v
