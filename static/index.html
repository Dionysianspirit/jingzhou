<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>径舟</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<link rel="stylesheet" href="/studio.css">
</head>
<body>
<div class="progress-bar" id="progress" style="width:0"></div>
<aside class="sidebar">
  <div class="sb-head">
    <div class="brand">
      <div class="brand-mark">径</div>
      <div>
        <h1>径舟</h1>
        <div class="sub">书山有路 · 学海行舟</div>
      </div>
    </div>
  </div>
  <div class="upload-zone" id="uploadZone">
    <div class="up-icon">📜</div>
    <p>投卷入舱，或 <b>轻点以传</b></p>
    <input type="file" accept=".pdf,.txt,.md" multiple hidden id="fileInput">
  </div>
  <button class="sample-btn" id="sampleBtn" type="button">载入示例教材《线性代数导引》</button>
  <div class="doc-list" id="docList"></div>
  <div class="sb-foot"><span id="docCount">0</span> 卷在舱</div>
</aside>
<main class="main">
  <div class="chat-top">
    <span class="ct-dot idle" id="statusDot"></span>
    <span class="ct-text" id="headerInfo">择卷而问</span>
  </div>
  <div class="feat-grid" id="featGrid">
    <button class="feat-card" data-feature="guide" disabled>
      <span class="fc-icon">导</span>
      <div class="fc-label">指南</div>
      <div class="fc-desc">导读 · 要点 · 思考题</div>
    </button>
    <button class="feat-card" data-feature="flashcards" disabled>
      <span class="fc-icon">🃏</span>
      <div class="fc-label">笺卡</div>
      <div class="fc-desc">关键概念问答笺卡</div>
    </button>
    <button class="feat-card" data-feature="quiz" disabled>
      <span class="fc-icon">📝</span>
      <div class="fc-label">考核</div>
      <div class="fc-desc">择题自测与判第</div>
    </button>
    <button class="feat-card" data-feature="mindmap" disabled>
      <span class="fc-icon">🧠</span>
      <div class="fc-label">脉络</div>
      <div class="fc-desc">知识结构可视化</div>
    </button>
    <button class="feat-card" data-feature="report" disabled>
      <span class="fc-icon">📄</span>
      <div class="fc-label">析报</div>
      <div class="fc-desc">结构化学习析报</div>
    </button>
    <button class="feat-card" data-feature="table" disabled>
      <span class="fc-icon">📊</span>
      <div class="fc-label">簿册</div>
      <div class="fc-desc">提取结构化数据</div>
    </button>
    <button class="feat-card" data-feature="infographic" disabled>
      <span class="fc-icon">📈</span>
      <div class="fc-label">览图</div>
      <div class="fc-desc">数据可视化一览</div>
    </button>
  </div>
  <div class="chat-msgs" id="messages">
    <div class="chat-empty" id="chatEmpty">
      <div class="ce-char">舟</div>
      <h2>径舟</h2>
      <p>书山有路勤为径，学海无涯苦作舟。<br>投卷入舱，择卷而问。</p>
    </div>
  </div>
  <div class="chat-inp-wrap">
    <div class="inp-row">
      <textarea id="chatInput" placeholder="择一卷而问之…" rows="1" disabled></textarea>
      <button class="send-btn" id="sendBtn" disabled title="发送">发</button>
    </div>
  </div>
</main>
<div class="modal-mask" id="modalMask" style="display:none">
  <div class="modal-sheet">
    <div class="modal-head">
      <h3 id="modalTitle">笺卡</h3>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<script src="/studio.js"></script>
</body>
</html>
